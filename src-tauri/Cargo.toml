[package]
name = "linux-env-manager"
version = "0.4.0"
description = "A user-scoped Linux environment variable manager"
authors = ["Linux Environment Manager contributors"]
edition = "2021"

[lib]
name = "linux_env_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
